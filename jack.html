<script id="scenario-data" type="application/json">{"title": "The First Meeting — Interactive Scenario", "version": "v1.1 | 17 November 2026", "audience": "Social work students practising first-session communication", "setting": "Student Services, Monday morning, public secondary school, Western Australia", "characters": {"You": "School social worker (the learner; originally Sam in the source script)", "Jack": "12-year-old Year 7 student", "Ms Taylor": "Jack’s classroom teacher (not present)"}, "source": "Adapted from Initial Engagement - Jack.docx (user-provided). Main scenario follows the source; alternative dialogue branches are proposed teaching additions. Original source names the social worker Sam; the learner-facing version uses You.", "principles": ["Safety", "Trustworthiness and Transparency", "Empowerment, Voice and Choice", "Collaboration and Mutuality"], "context": {"setting": "Student Services, Monday morning, at a public secondary school in Western Australia.", "role": "You are a school social worker. You have spent time supporting students in Jack’s classroom, but this is your first individual conversation with him.", "student": "Jack is 12 and in Year 7. He has recently moved from primary school to secondary school.", "background": "Jack’s close primary-school friends attend different schools, and he has found making new friends difficult. Ms Taylor has noticed that he sometimes seems distracted or disengaged in lessons, particularly when copying things off the board. He also appears uncomfortable in noisy, busy classrooms.", "purpose": "Ms Taylor has asked Jack to come to Student Services. Your aim is to get to know Jack, hear his perspective and explore how school has been going."}, "opening": [{"who": "Narrator", "text": "Jack appears at the doorway with his school bag."}, {"who": "You", "text": "Hey, Jack! How are you?"}, {"who": "Jack", "text": "Good."}, {"who": "You", "text": "How's your day going?"}, {"who": "Jack", "text": "Alright."}, {"who": "You", "text": "Yeah? Come in, mate. Grab a seat wherever you like."}, {"who": "Narrator", "text": "Jack puts his bag beside a chair and sits down."}, {"who": "You", "text": "How was your weekend? Do anything interesting?"}, {"who": "Jack", "text": "Not really."}, {"who": "You", "text": "Just a quiet one?"}, {"who": "Jack", "text": "Yeah. Played some games."}, {"who": "You", "text": "Oh, nice. What were you playing?"}, {"who": "Jack", "text": "Minecraft."}, {"who": "You", "text": "Ah, Minecraft. Were you playing on your own or with someone?"}, {"who": "Jack", "text": "With my cousin. But he kept dying."}, {"who": "You", "text": "(Laughs) Oh no. Was he any good?"}, {"who": "Jack", "text": "Nah. He kept losing all our stuff."}, {"who": "You", "text": "Oh, that's annoying. Did you manage to get it back?"}, {"who": "Jack", "text": "Some of it."}, {"who": "You", "text": "Fair enough. Sounds like you had a pretty good weekend then."}, {"who": "Jack", "text": "Yeah, I guess."}, {"who": "Narrator", "text": "You settle back into the chair."}, {"who": "You", "text": "You've seen me in your classroom a few times, haven't you?"}, {"who": "Jack", "text": "Yeah."}, {"who": "You", "text": "I think I was there last Thursday. In Ms Taylor's class?"}, {"who": "Jack", "text": "Yeah."}, {"who": "You", "text": "Yeah, that's right. I come into different classes sometimes, help out a bit, talk to students. Have you been down to Student Services before?"}, {"who": "Jack", "text": "Um, once. When I lost my timetable."}, {"who": "You", "text": "Oh, right. Did you find it in the end?"}, {"who": "Jack", "text": "Nah, they printed me another one."}, {"who": "You", "text": "Ah, good. Easy fix."}, {"who": "Narrator", "text": "Jack looks towards the door."}], "n1": {"title": "Am I in trouble?", "tip": ["Safety", "Trustworthiness and Transparency", "Choice"], "scene": [{"who": "You", "text": "So, did Ms Taylor tell you why she wanted you to come and see me today?"}, {"who": "Jack", "text": "Not really. She just said I had to come here."}, {"who": "You", "text": "Ah, okay."}, {"who": "Jack", "text": "Am I in trouble?"}], "prompt": "What would you say next?", "options": [{"id": "A", "label": "Explain the meeting and invite Jack’s agreement", "sam": "No, you’re not in trouble. Ms Taylor thought it might help to talk about how school’s going. I’d like to hear your side. Is that okay?", "reaction": [{"who": "Jack", "text": "Oh. Okay. I thought I did something wrong."}, {"who": "You", "text": "I can see why you might have wondered that."}, {"who": "Jack", "text": "Yeah."}], "note": "The purpose becomes clearer; Jack is invited to participate rather than treated as a problem."}, {"id": "B", "label": "Reassure without really explaining", "sam": "Nah, you’re all good, mate. Don’t worry. We’re just having a chat.", "reaction": [{"who": "Jack", "text": "Okay…"}, {"who": "Narrator", "text": "Jack shifts in his chair and glances at the door."}], "note": "Jack has heard reassurance, but the reason for the meeting remains uncertain."}, {"id": "C", "label": "Begin with the teacher’s concern", "sam": "Ms Taylor says you haven’t been finishing work in English. She wants me to find out why.", "reaction": [{"who": "Jack", "text": "But I do my work!"}, {"who": "Narrator", "text": "Jack leans back and folds his arms."}], "note": "Jack may experience this as another adult blaming him, even if Sam’s intention is to help."}], "display_order": ["B", "C", "A"]}, "repair1": {"title": "Jack looks away", "prompt": "What would you say now?", "options": [{"id": "repair", "label": "Acknowledge the impact and reframe", "sam": "Sorry, Jack. I think I made it sound like you’ve done something wrong. That’s not what I meant. I’d like to hear what school has been like for you, from your point of view.", "reaction": [{"who": "Jack", "text": "Oh. Okay."}, {"who": "Narrator", "text": "Jack uncrosses his arms, although he still looks a little unsure."}], "destination": "bridge1"}, {"id": "press", "l aps to copy down. Sometimes I can’t keep up."}, {"who": "You", "text": "Thanks for explaining that."}]}, "n2": {"title": "Are you gonna tell Miss?", "tip": ["Trustworthiness and Transparency", "Safety", "Ethical information sharing"], "scene": [{"who": "Narrator", "text": "A brief pause. Jack looks at you."}, {"who": "Jack", "text": "Are you gonna tell Miss?"}, {"who": "You", "text": "Tell her what you’ve said?"}, {"who": "Jack", "text": "Yeah."}], "prompt": "How would you explain what can and cannot be kept private?", "options": [{"id": "A", "label": "Explain confidentiality and its limits", "sam": "I won’t repeat everything you say. I keep brief notes, and I may need to share information if someone isn’t safe. If talking to a teacher could help, I’d discuss it with you first where possible. Does that make sense?", "reaction": [{"who": "Jack", "text": "Yeah. I just don’t want her getting annoyed again."}, {"who": "You", "text": "I hear you. We can talk about what you’d feel okay with."}], "note": "A realistic, age-appropriate account of information sharing; exact duties must be checked against local policy."}, {"id": "B", "label": "Give vague reassurance", "sam": "Nah, don’t worry about it. You’re fine.", "reaction": [{"who": "Jack", "text": "But… would she find out?"}, {"who": "Narrator", "text": "Jack waits for a clearer answer."}], "note": "The immediate concern remains unanswered. Jack may not feel able to decide what to disclose."}, {"id": "C", "label": "Promise complete secrecy", "sam": "No. I promise I won’t tell anyone what you’ve said.", "reaction": [{"who": "Jack", "text": "Really? Okay."}, {"who": "Narrator", "text": "Jack looks relieved and seems more willing to talk."}], "note": "The reassurance may work in the short term, but it is an inaccurate promise and must be corrected."}], "display_order": ["A", "C", "B"]}, "repair2": {"B": {"title": "Jack asks again", "prompt": "What would you say now?", "options": [{"id": "clarify", "label": "Answer directly and check understanding", "sam": "Sorry, I didn’t really answer your question. I don’t repeat everything you tell me. I keep some notes, and sometimes I have to share something if someone isn’t safe. If talking with a teacher might help, I’d discuss that with you first where possible. How does that sound?", "reaction": [{"who": "Jack", "text": "Okay. I just don’t want everyone knowing."}, {"who": "You", "text": "That makes sense. We can take this one step at a time."}], "destination": "bridge2"}, {"id": "dismiss", "label": "Move on without answering", "sam": "Let’s not worry about it now. What do you do at lunchtime?", "reaction": [{"who": "Jack", "text": "I don’t really want to talk about that."}, {"who": "You", "text": "Okay. We don’t have to."}, {"who": "Jack", "text": "Can I go back to class?"}], "destination": "early2"}], "display_order": ["dismiss", "clarify"]}, "C": {"title": "Jack seems relieved", "prompt": "What would you say next?", "options": [{"id": "correct", "label": "Correct the promise now", "sam": "Jack, I need to correct something I just said. I shouldn’t have promised I’d never tell anyone. Most of what you say stays between us, but if someone isn’t safe I may need to share information. I’d explain that to you as much as possible. I’m sorry I wasn’t clear.", "reaction": [{"who": "Jack", "text": "So you might tell Miss?"}, {"who": "You", "text": "Not automatically. We’d talk about what might be helpful to share, and with whom, unless there’s a safety reason I have to act."}, {"who": "Jack", "text": "Okay…"}], "destination": "bridge2"}, {"id": "leave", "label": "Leave the promise uncorrected", "sam": "So, what do you usually do at lunchtime?", "reaction": [{"who": "Jack", "text": "Usually go to the library."}, {"who": "Narrator", "text": "Jack continues, believing that nothing he says could ever be shared."}], "destination": "bridge2", "flag": "unresolvedPromise"}], "display_order": ["leave", "correct"]}}, "bridge2": {"clear": [{"who": "You", "text": "What about lunchtime? Do you get a bit of a break from the noise then?"}, {"who": "Jack", "text": "Yeah. Sometimes I go to the library. It’s quiet."}, {"who": "You", "text": "Do you hang out with anyone from your classes?"}, {"who": "Jack", "text": "Sometimes these boys, but they’ve known each other since primary school."}, {"who": "You", "text": "Did anyone from your primary school come here?"}, {"who": "Jack", "text": "Nah. My friends all went to different schools."}, {"who": "You", "text": "Doesn’t sound like lunchtime’s been much fun lately."}, {"who": "Jack", "text": "Not really."}, {"who": "You", "text": "Have you mentioned any of this to anyone at school?"}, {"who": "Jack", "text": "No."}], "cautious": [{"who": "You", "text": "We don’t have to talk about anything you’re not ready for. What’s lunchtime usually like?"}, {"who": "Jack", "text": "It’s okay. I go to the library."}, {"who": "You", "text": "What do you like about it?"}, {"who": "Jack", "text": "It’s quiet. And I don’t really know many people here."}, {"who": "You", "text": "That sounds like quite a change from primary school."}, {"who": "Jack", "text": "Yeah. My friends went to other schools."}, {"who": "You", "text": "Have you wanted anyone at school to help with that?"}, {"who": "Jack", "text": "Not really."}], "misled": [{"who": "You", "text": "What about lunchtime? What’s that been like?"}, {"who": "Jack", "text": "I mostly go to the library. I don’t really have friends here."}, {"who": "You", "text": "That sounds lonely sometimes."}, {"who": "Jack", "text": "Yeah. My old friends all go to different schools. The boys here already know each other."}, {"who": "You", "text": "Have you talked with anyone at school about that?"}, {"who": "Jack", "text": "No."}]}, "n3": {"title": "I don’t want them to make it a big thing.", "tip": ["Empowerment, Voice and Choice", "Collaboration and Mutuality", "Safety"], "scene": [{"who": "Jack", "text": "I don’t want them to make it a big thing."}, {"who": "You", do if there’s a safety concern.", "reaction": [{"who": "Jack", "text": "I just don’t want everyone asking me questions."}, {"who": "You", "text": "That makes sense. Would you rather leave it for today or talk again another time?"}, {"who": "Jack", "text": "Maybe another time."}], "destination": "cautious"}, {"id": "insist", "label": "Insist on the proposed plan", "sam": "I know you’re worried, but adults need to deal with this. I’ll talk to her.", "reaction": [{"who": "Jack", "text": "Then I’m not saying anything else. Can I go?"}, {"who": "Narrator", "text": "Jack picks up his bag."}], "destination": "early3"}], "display_order": ["insist", "repair"]}, "promise_reveal": {"title": "But you said...", "scene": [{"who": "Jack", "text": "But you said you wouldn’t tell anybody."}, {"who": "Narrator", "text": "Jack remembers your earlier promise of complete secrecy. Even discussing possible support now creates confusion."}], "prompt": "What would you say to Jack?", "options": [{"id": "correct", "label": "Acknowledge and correct the promise", "sam": "You’re right, Jack. I did say that, and I was wrong to promise it. I’m sorry. I won’t repeat everything you’ve said, but there are safety situations where I may need to share information. Before we decide anything else, I want to make sure you understand that.", "reaction": [{"who": "Jack", "text": "Oh. Okay. I need to think about it."}, {"who": "You", "text": "Of course. You don’t have to decide about next steps right now."}], "destination": "cautious"}, {"id": "deflect", "label": "Deflect Jack’s concern", "sam": "Don’t worry about that. I’m just trying to help.", "reaction": [{"who": "Jack", "text": "I want to go back to class."}], "destination": "earlyPromise"}], "display_order": ["deflect", "correct"]}, "endings": {"collaborative": {"title": "You agree to talk again", "script": [{"who": "You", "text": "We’ve talked about English, lunchtime, and getting used to Year 7. We don’t need to cover everything today. Would another chat here be okay, or would you rather leave it for now?"}, {"who": "Jack", "text": "I could come back another time."}, {"who": "You", "text": "Okay. We can plan that together."}], "summary": "Jack has had a meaningful say in what happens next. This is a promising initial connection, not a solved school problem.", "reflect": ["Which explanations helped Jack make an informed choice?", "How was Jack’s preference included in planning?"]}, "cautious": {"title": "The conversation pauses", "script": [{"who": "You", "text": "We don’t have to decide anything more today. If you want to talk again, we can. I’ll explain any steps I need to take."}, {"who": "Jack", "text": "Okay. Maybe."}], "summary": "Jack is not ready to commit to support. Respecting his pace can still be appropriate trauma-informed practice.", "reflect": ["What might Jack need before feeling ready to re-engage?", "What responsibilities remain for you after this session?"]}, "early1": {"title": "Jack returns to class", "script": [{"who": "You", "text": "Okay. We don’t need to keep talking now. I’m sorry I made this feel like you were in trouble. You’re welcome to talk with me another time."}, {"who": "Jack", "text": "Alright."}, {"who": "Narrator", "text": "Jack takes his bag and returns to class."}], "summary": "The first conversation ends before Jack has discussed his school experiences. You should follow school safeguarding and follow-up procedures as appropriate.", "reflect": ["How did the opening frame Jack as a problem?", "How could you approach a future invitation differently?"]}, "early2": {"title": "Jack chooses to leave", "script": [{"who": "You", "text": "Okay. We can stop here. I’m sorry I wasn’t clear when you asked about telling Ms Taylor. Before you go, I can explain what I can keep private, if you’d like."}, {"who": "Jack", "text": "Not now."}, {"who": "You", "text": "That’s okay."}], "summary": "Jack leaves without further disclosure. An unanswered question about information sharing may have u ve safety and statutory duties.", "educational": "Jack’s reactions are one plausible narrative outcome, not certain psychological predictions.", "presentation": "Show Context on its own screen. The opening conversation follows Start Conversation. Hide pedagogical option labels, TIP principle pills, decision counts, grading, pathway tracking and repair categories. Display the chosen dialogue and Jack’s reaction without explanatory feedback until What happened? and Reflection at an ending.", "display_order": "Option IDs are internal stable keys for branching (A/B/C semantics from v1). display_order lists those keys in visual sequence; visible A/B/C letters are assigned by position, not by semantic ID.", "offline": "The HTML embeds a byte-for-byte copy of this JSON to run offline under file://. After editing this JSON, regenerate the HTML embedded scenario-data block."}}</script>

const DATA=JSON.parse(document.getElementById('scenario-data').textContent);
const screenEl=document.getElementById('screen');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
function reset(){S={screen:'intro',selected:null,node1Choice:null,repair1Choice:null,node2Choice:null,repair2Choice:null,unresolvedPromise:false,node3Choice:null,repair3Choice:null,promiseChoice:null,ending:null,history:[],bridge1:'A',bridge2:'clear'};render();}
function log(k,v){S.history.push({step:k,choice:v});} // developer-only state; no on-screen scoring or history.
function setScreen(next){S.screen=next;S.selected=null;render();window.scrollTo({top:0,behavior:'instant'});}
function choose(id){S.selected=id;render();} // Once chosen, show the resulting dialogue in place of the options.
function finish(key){S.ending=key;setScreen('ending');}
function next(){const sel=S.selected,d=S.screen;
 if(d==='intro')return setScreen('opening');
 if(d==='opening')return setScreen('node1');
 if(d==='bridge1')return setScreen('node2');
 if(d==='bridge2')return setScreen('node3');
 if(d==='node1'){if(!sel)return;S.node1Choice=sel;log('n1',sel);if(sel==='C')return setScreen('repair1');S.bridge1=sel;return setScreen('bridge1');}
 if(d==='repair1'){if(!sel)return;S.repair1Choice=sel;log('repair1',sel);if(sel==='press')return finish('early1');S.bridge1='C_repaired';return setScreen('bridge1');}
 if(d==='node2'){if(!sel)return;S.node2Choice=sel;log('n2',sel);if(sel==='A'){S.bridge2='clear';return setScreen('bridge2');}return setScreen('repair2');}
 if(d==='repair2'){if(!sel)return;S.repair2Choice=sel;log('repair2',sel);if(S.node2Choice==='B'){if(sel==='dismiss')return finish('early2');S.bridge2='cautious';return setScreen('bridge2');}if(sel==='leave'){S.unresolvedPromise=true;S.bridge2='misled';}else{S.unresolvedPromise=false;S.bridge2='cautious';}return setScreen('bridge2');}
 if(d==='node3'){if(!sel)return;S.node3Choice=sel;log('n3',sel);if(sel==='A')return S.unresolvedPromise?setScreen('promiseReveal'):finish('collaborative');if(sel==='B')return setScreen('repair3');return finish('cautious');}
 if(d==='repair3'){if(!sel)return;S.repair3Choice=sel;log('repair3',sel);return finish(sel==='repair'?'cautious':'early3');}
 if(d==='promiseReveal'){if(!sel)return;S.promiseChoice=sel;log('promise',sel);if(sel==='correct'){S.unresolvedPromise=false;return finish('cautious');}return finish('earlyPromise');}
}
const dialog=(lines)=>`<div class="dialogue">${(lines||[]).map(x=>`<div class="line ${x.who==='Narrator'?'narrator':''}"><div class="who">${esc(x.who==='Sam'?'You':x.who)}</div><div>${esc(x.text)}</div></div>`).join('')}</div>`;
const btn=(label)=>`<button type="button" class="cta" data-action="next">${esc(label)} <span aria-hidden="true">→</span></button>`;
function optionsInOrder(item){const index=Object.fromEntries(item.options.map(o=>[o.id,o]));return(item.display_order||item.options.map(o=>o.id)).map(id=>index[id]);}
function decision(title,scene,prompt,item){
 let chosen=item.options.find(x=>x.id===S.selected);
 let t=`<h1>${esc(title)}</h1>${scene?dialog(scene):''}`;
 if(!chosen){t+=`<div class="prompt">${esc(prompt)}</div><div class="choice-list">`;
  t+=optionsInOrder(item).map((o,i)=>`<button type="button" class="choice" data-choose="${esc(o.id)}"><strong>${String.fromCharCode(65+i)}.</strong><span class="quote">“${esc(o.sam)}”</span></button>`).join('')+'</div>';
 }else{
  t+=`<div class="consequence">${dialog([{who:'You',text:chosen.sam},...chosen.reaction])}</div>${btn('Continue')}`;
 }
 return t;
}
function render(){let t='';const page=S.screen;
 if(page==='intro'){
  const c=DATA.context;
  t=`<h1>The First Meeting</h1><section class="intro-context" aria-label="Scenario context"><div class="intro-block"><h2>Setting</h2><p>${esc(c.setting)}</p></div><div class="intro-block"><h2>Your role</h2><p>${esc(c.role)} ${esc(c.purpose)}</p></div><div class="intro-block"><h2>About Jack</h2><p>${esc(c.student)} ${esc(c.background)}</p></div></section>${btn('Start Conversation')}`;
 }else if(page==='opening'){
  t=`<h1>First meeting</h1>${dialog(DATA.opening)}${btn('Continue')}`;
 }else if(['node1','node2','node3'].includes(page)){
  const item=DATA['n'+page.slice(-1)];t=decision(item.title,item.scene,item.prompt,item);
 }else if(['repair1','repair2','repair3','promiseReveal'].includes(page)){
  const item=page==='repair2'?DATA.repair2[S.node2Choice]:(page==='promiseReveal'?DATA.promise_reveal:DATA[page]);
  t=decision(item.title,item.scene,item.prompt,item);
 }else if(['bridge1','bridge2'].includes(page)){
  const b=page==='bridge1'?DATA.bridge1[S.bridge1]:DATA.bridge2[S.bridge2];
  t=`<h1>${page==='bridge1'?'Getting to know Year 7':'Lunchtime and friendships'}</h1>${dialog(b)}${btn('Continue')}`;
 }else if(page==='ending'){
  const e=DATA.endings[S.ending];
  t=`<h1>${esc(e.title)}</h1>${dialog(e.script)}<section class="outcome"><h2>What happened?</h2><p>${esc(e.summary)}</p>${S.unresolvedPromise?'<p>The earlier promise of complete secrecy has not been corrected. Jack’s understanding of confidentiality remains inaccurate.</p>':''}</section><section class="reflection"><h2>Reflection</h2><ul>${e.reflect.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><p class="next-copy">This is one possible response to the interaction, not a prediction. No known trauma history or diagnosis is assumed.</p><button type="button" class="cta" data-action="reset">Restart Simulation ↻</button>`;
 }
 screenEl.innerHTML=t;
 screenEl.querySelectorAll('[data-choose]').forEach(el=>el.addEventListener('click',()=>choose(el.dataset.choose)));
 screenEl.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>el.dataset.action==='reset'?reset():next()));
}
document.getElementById('resetTop').addEventListener('click',reset);
reset();
</script>
</body>
</html>
