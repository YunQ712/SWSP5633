<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Initial Engagement | Module 04 · Interactive Simulation</title>
<style>
:root{color-scheme:light;--bg:#f6f5ef;--paper:#fffef9ef9;--ink:#23483d;--muted:#63756b;--accent:#23483d;--accent-hover:#1b3d34;--edge:#d9ddd2;--light:#e6ecdf;--jack:#23483d;--you:#63756b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
header{background:var(--paper);border-bottom:1px solid var(--edge)}
.wrap{max-width:890px;margin:auto;padding:0 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:17px;padding-bottom:17px}
.brand{font-weight:750;color:var(--ink);font-size:15px}
.tag{font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #7a895d;outline-offset:3px}
.reset{border:1px solid var(--edge);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:14px}
.reset:hover,.back:hover{background:#e6ecdf;border-color:#aebc99}
main.wrap{margin-top:30px;margin-bottom:60px}
.paper{border:1px solid var(--edge);background:var(--paper);border-radius:16px;box-shadow:0 8px 24px #294b3310;padding:30px 34px;min-height:410px}
h1{font-size:clamp(28px,4.2vw,38px);line-height:1.2;margin:0 0 16px;letter-spacing:-.025em}
h2{font-size:23px;letter-spacing:-.015em;line-height:1.3;margin:0 0 12px}
h3{font-size:17px;margin:0 0 8px}
.lede{font-size:16px;color:var(--muted);margin:0 0 22px}
.small{font-size:13px}.muted{color:var(--muted)}
.context{border:1px solid #d9ddd2;border-radius:12px;padding:19px 21px;background:var(--paper);margin:21px 0}
.context h2{font-size:18px}
.context dt{font-weight:750;margin:22px 0 3px}
.context dt:first-child{margin-top:0}
.context dd{margin:0;color:var(--ink)}
.dialogue{border-left:3px solid #aebc99;padding-left:18px;margin:17px 0 25px}
.line{margin-bottom:12px}
.who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.075em;color:var(--jack);margin-bottom:1px}
.line.speaker-you .who{color:var(--you)}
.line.narrator{font-style:italic;color:var(--muted);font-size:14px}
.line.narrator .who{display:none}
.prompt{font-weight:750;margin:22px 0 13px}
.choice-list{display:grid;gap:12px}
.choice{width:100%;text-align:left;background:var(--paper);border:1px solid #d9ddd2;border-radius:12px;padding:17px;color:var(--ink);transition:background .1s,border-color .1s}
.choice:hover{border-color:var(--accent);background:#fffef9ef9}
.choice strong{display:inline-block;color:var(--accent);min-width:28px;font-size:14px}
.choice .quote{font-size:15px}
.consequence{border-top:1px solid var(--edge);margin-top:23px;padding-top:20px}
.consequence .dialogue{margin:7px 0 14px}
.nav-actions{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin-top:19px}
.cta,.back{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:10px;padding:11px 18px;font-weight:720}
.cta{background:var(--accent);color:#fffef9;border:1px solid var(--accent)}
.cta:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.back{background:var(--paper);color:var(--accent);border:1px solid #aebc99}
.change{border:0;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:7px 0;margin-top:7px;font-weight:650;font-size:14px}
.change:hover{color:#356451}
.outcome{border-radius:12px;background:#e6ecdf;padding:18px 20px;margin:23px 0}
.outcome p{margin:5px 0 0}
.reflection{border-radius:12px;background:#fffef9ef9;padding:19px 20px}
.reflection li{margin-bottom:7px}.reflection ul{margin:9px 0 0;padding-left:20px}
.next-copy{margin:14px 0 0;color:var(--muted);font-size:14px}
@media(max-width:700px){
main.wrap{margin-top:16px}.paper{padding:23px 20px;min-height:0}
.top{padding:13px 0}.brand{font-size:13px}.wrap{padding:0 14px}
.tag{font-size:11px}.reset{padding:7px 9px;font-size:12px}
.nav-actions{gap:10px}.cta,.back{padding:10px 14px}
}

/* Generated session transcript and choice-by-choice practice reflections */
.script-review{border-top:1px solid var(--edge);margin-top:24px;padding-top:23px}
.script-review h2{margin-bottom:6px}
.script-intro{color:var(--muted);font-size:14px;margin:0 0 16px}
.transcript{border:1px solid var(--edge);border-radius:12px;background:#fffef9ef9;padding:18px 20px}
.transcript .line{margin:0 0 13px;padding:3px 0}
.transcript .line:last-child{margin-bottom:0}
.transcript .chosen-response{margin:16px -7px;padding:14px 16px;border-left:4px solid var(--you);border-radius:8px;background:#f1f0e9}
.transcript .chosen-response .who{color:#63756b}
.transcript .chosen-marker{font-size:12px;font-weight:750;color:#63756b;letter-spacing:.02em;margin-bottom:4px}
.inline-reflection{border-top:1px solid #d9ddd2;margin-top:13px;padding-top:10px;color:#23483d}
.inline-reflection .reflection-label{color:#63756b;font-size:13px;font-weight:750;letter-spacing:.01em;margin-bottom:4px}
.inline-reflection p{font-size:14px;line-height:1.7;margin:0}
@media(max-width:700px){.transcript{padding:12px 13px}.transcript .chosen-response{margin-left:-3px;margin-right:-3px}.inline-reflection p{font-size:14px}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.sim-page-label{display:flex;flex-direction:column;line-height:1.3}.sim-page-label strong{font-size:14px;color:var(--ink)}.sim-page-label span{font-size:12px;color:var(--muted)}.home-button{text-decoration:none;white-space:nowrap}
</style>
</head>

<script id="scenario-data" type="application/json">{"title":"Initial Engagement — Module 04 · Interactive Simulation","version":"v4.0 preview | 25 November 2026","audience":"Social work students practising first-session communication","setting":"Student Services, Monday morning, public secondary school, Western Australia","characters":{"You":"School social worker (the learner; originally Sam in the source script)","Jack":"12-year-old Year 7 student","Ms Taylor":"Jack’s classroom teacher (not present)"},"source":"Adapted from Initial Engagement - Jack.docx (user-provided). Main scenario follows the source; alternative dialogue branches are proposed teaching additions. Original source names the social worker Sam; the learner-facing version uses You.","principles":["Safety","Trustworthiness and Transparency","Empowerment, Voice and Choice","Collaboration and Mutuality"],"context":{"setting":"Student Services, Monday morning, at a public secondary school in Western Australia.","role":"You are a school social worker. The teacher (Ms Taylor) has asked Jack to come to Student Services. You have spent time supporting students in Jack’s classroom, but this is your first individual conversation with him.","student":"Jack is 12 and in Year 7. He has recently moved from primary school to secondary school. Ms Taylor has noticed that he sometimes seems distracted or disengaged in class. He also appears uncomfortable in noisy classrooms."},"opening":[{"who":"Narrator","text":"Jack appears at the doorway with his school bag."},{"who":"You","text":"Hey, Jack! How are you?"},{"who":"Jack","text":"Good."},{"who":"You","text":"How's your day going?"},{"who":"Jack","text":"Alright."},{"who":"You","text":"Yeah? Come in, mate. Grab a seat wherever you like."},{"who":"Narrator","text":"Jack puts his bag beside a chair and sits down."},{"who":"You","text":"How was your weekend? Do anything interesting?"},{"who":"Jack","text":"Not really."},{"who":"You","text":"Just a quiet one?"},{"who":"Jack","text":"Yeah. Played some games."},{"who":"You","text":"Oh, nice. What were you playing?"},{"who":"Jack","text":"Minecraft."},{"who":"You","text":"Ah, Minecraft. Were you playing on your own or with someone?"},{"who":"Jack","text":"With my cousin. But he kept dying."},{"who":"You","text":"(Laughs) Oh no. Was he any good?"},{"who":"Jack","text":"Nah. He kept losing all our stuff."},{"who":"You","text":"Oh, that's annoying. Did you manage to get it back?"},{"who":"Jack","text":"Some of it."},{"who":"You","text":"Fair enough. Sounds like you had a pretty good weekend then."},{"who":"Jack","text":"Yeah, I guess."},{"who":"Narrator","text":"You settle back into the chair."},{"who":"You","text":"You've seen me in your classroom a few times, haven't you?"},{"who":"Jack","text":"Yeah."},{"who":"You","text":"I think I was there last Thursday. In Ms Taylor's class?"},{"who":"Jack","text":"Yeah."},{"who":"You","text":"Yeah, that's right. I come into different classes sometimes, help out a bit, talk to students. Have you been down to Student Services before?"},{"who":"Jack","text":"Um, once. When I lost my timetable."},{"who":"You","text":"Oh, right. Did you find it in the end?"},{"who":"Jack","text":"Nah, they printed me another one."},{"who":"You","text":"Ah, good. Easy fix."},{"who":"Narrator","text":"Jack looks towards the door."}],"n1":{"title":"Am I in trouble?","tip":["Safety","Trustworthiness and Transparency","Choice"],"scene":[{"who":"You","text":"So, did Ms Taylor tell you why she wanted you to come and see me today?"},{"who":"Jack","text":"Not really. She just said I had to come here."},{"who":"You","text":"Ah, okay."},{"who":"Jack","text":"Am I in trouble?"}],"prompt":"What would you say next?","options":[{"id":"A","label":"Explain the meeting and invite Jack’s agreement","sam":"No, you’re not in trouble. Ms Taylor thought it might help to talk about how school’s going. I’d like to hear your side. Is that okay?","reaction":[{"who":"Jack","text":"Oh. Okay. I thought I did something wrong."},{"who":"You","text":"I can see why you might have wondered that."},{"who":"Jack","text":"Yeah."}],"note":"The purpose becomes clearer; Jack is invited to participate rather than treated as a problem."},{"id":"B","label":"Reassure without really explaining","sam":"Nah, you’re all good, mate. Don’t worry. We’re just having a chat.","reaction":[{"who":"Jack","text":"Okay…"},{"who":"Narrator","text":"Jack shifts in his chair and glances at the door."}],"note":"Jack has heard reassurance, but the reason for the meeting remains uncertain."},{"id":"C","label":"Begin with the teacher’s concern","sam":"Ms Taylor says you haven’t been finishing work in English. She wants me to find out why.","reaction":[{"who":"Jack","text":"But I do my work!"},{"who":"Narrator","text":"Jack leans back and folds his arms."}],"note":"Jack may experience this as another adult blaming him, even if Sam’s intention is to help."}],"display_order":["B","C","A"]},"repair1":{"title":"Jack looks away","prompt":"What would you say now?","options":[{"id":"repair","label":"Acknowledge the impact and reframe","sam":"Sorry, Jack. I think I made it sound like you’ve done something wrong. That’s not what I meant. I’d like to hear what school has been like for you, from your point of view.","reaction":[{"who":"Jack","text":"Oh. Okay."},{"who":"Narrator","text":"Jack uncrosses his arms, although he still looks a little unsure."}],"destination":"bridge1"},{"id":"press","label":"Keep questioning his classroom behaviour","sam":"So why aren’t you finishing the work?","reaction":[{"who":"Jack","text":"I dunno."},{"who":"You","text":"Is there something making it difficult?"},{"who":"Jack","text":"Can I just go back to class?"}],"destination":"early1"}],"display_order":["press","repair"]},"bridge1":{"A":[{"who":"You","text":"How’s Year 7 been going anyway?"},{"who":"Jack","text":"Sort of getting used to it. There’s heaps more people."},{"who":"You","text":"And the classes? Any favourites?"},{"who":"Jack","text":"Science sometimes. We made circuits. But I don’t like English."},{"who":"You","text":"Oh yeah? What’s happening in English?"},{"who":"Jack","text":"We have to copy heaps off the board. Everyone’s talking and sometimes I can’t finish before Miss changes it."},{"who":"You","text":"That sounds frustrating. Thanks for telling me."}],"B":[{"who":"You","text":"What’s Year 7 been like for you?"},{"who":"Jack","text":"It’s alright, I guess."},{"who":"You","text":"Anything different from primary school?"},{"who":"Jack","text":"Heaps more people. Different rooms all day."},{"who":"You","text":"How’s English going?"},{"who":"Jack","text":"I dunno. Sometimes there’s too much writing."},{"who":"You","text":"What happens when there’s too much?"},{"who":"Jack","text":"I don’t always finish it. And it’s noisy."},{"who":"You","text":"That sounds frustrating. Thanks for telling me."}],"C_repaired":[{"who":"You","text":"We don’t have to start with English. What’s Year 7 been like for you?"},{"who":"Jack","text":"Dunno. It’s different."},{"who":"You","text":"Different how?"},{"who":"Jack","text":"There’s heaps more people. I get lost sometimes."},{"who":"You","text":"Any subjects you enjoy?"},{"who":"Jack","text":"Science. English is annoying, though."},{"who":"You","text":"What makes it annoying?"},{"who":"Jack","text":"There’s heaps to copy down. Sometimes I can’t keep up."},{"who":"You","text":"Thanks for explaining that."}]},"n2":{"title":"Are you gonna tell Miss?","tip":["Trustworthiness and Transparency","Safety","Ethical information sharing"],"scene":[{"who":"Narrator","text":"A brief pause. Jack looks at you."},{"who":"Jack","text":"Are you gonna tell Miss?"},{"who":"You","text":"Tell her what you’ve said?"},{"who":"Jack","text":"Yeah."}],"prompt":"How would you explain what can and cannot be kept private?","options":[{"id":"A","label":"Explain confidentiality and its limits","sam":"I won’t repeat everything you say. I keep brief notes, and I may need to share information if someone isn’t safe. If talking to a teacher could help, I’d discuss it with you first where possible. Does that make sense?","reaction":[{"who":"Jack","text":"Yeah. I just don’t want her getting annoyed again."},{"who":"You","text":"I hear you. We can talk about what you’d feel okay with."}],"note":"A realistic, age-appropriate account of information sharing; exact duties must be checked against local policy."},{"id":"B","label":"Give vague reassurance","sam":"Nah, don’t worry about it. You’re fine.","reaction":[{"who":"Jack","text":"But… would she find out?"},{"who":"Narrator","text":"Jack waits for a clearer answer."}],"note":"The immediate concern remains unanswered. Jack may not feel able to decide what to disclose."},{"id":"C","label":"Promise complete secrecy","sam":"No. I promise I won’t tell anyone what you’ve said.","reaction":[{"who":"Jack","text":"Really? Okay."},{"who":"Narrator","text":"Jack looks relieved and seems more willing to talk."}],"note":"The reassurance may work in the short term, but it is an inaccurate promise and must be corrected."}],"display_order":["A","C","B"]},"repair2":{"B":{"title":"Jack asks again","prompt":"What would you say now?","options":[{"id":"clarify","label":"Answer directly and check understanding","sam":"Sorry, I didn’t really answer your question. I don’t repeat everything you tell me. I keep some notes, and sometimes I have to share something if someone isn’t safe. If talking with a teacher might help, I’d discuss that with you first where possible. How does that sound?","reaction":[{"who":"Jack","text":"Okay. I just don’t want everyone knowing."},{"who":"You","text":"That makes sense. We can take this one step at a time."}],"destination":"bridge2"},{"id":"dismiss","label":"Move on without answering","sam":"Let’s not worry about it now. What do you do at lunchtime?","reaction":[{"who":"Jack","text":"I don’t really want to talk about that."},{"who":"You","text":"Okay. We don’t have to."},{"who":"Jack","text":"Can I go back to class?"}],"destination":"early2"}],"display_order":["dismiss","clarify"]},"C":{"title":"Jack seems relieved","prompt":"What would you say next?","options":[{"id":"correct","label":"Correct the promise now","sam":"Jack, I need to correct something I just said. I shouldn’t have promised I’d never tell anyone. Most of what you say stays between us, but if someone isn’t safe I may need to share information. I’d explain that to you as much as possible. I’m sorry I wasn’t clear.","reaction":[{"who":"Jack","text":"So you might tell Miss?"},{"who":"You","text":"Not automatically. We’d talk about what might be helpful to share, and with whom, unless there’s a safety reason I have to act."},{"who":"Jack","text":"Okay…"}],"destination":"bridge2"},{"id":"leave","label":"Leave the promise uncorrected","sam":"So, what do you usually do at lunchtime?","reaction":[{"who":"Jack","text":"Usually go to the library."},{"who":"Narrator","text":"Jack continues, believing that nothing he says could ever be shared."}],"destination":"bridge2","flag":"unresolvedPromise"}],"display_order":["leave","correct"]}},"bridge2":{"clear":[{"who":"You","text":"What about lunchtime? Do you get a bit of a break from the noise then?"},{"who":"Jack","text":"Yeah. Sometimes I go to the library. It’s quiet."},{"who":"You","text":"Do you hang out with anyone from your classes?"},{"who":"Jack","text":"Sometimes these boys, but they’ve known each other since primary school."},{"who":"You","text":"Did anyone from your primary school come here?"},{"who":"Jack","text":"Nah. My friends all went to different schools."},{"who":"You","text":"Doesn’t sound like lunchtime’s been much fun lately."},{"who":"Jack","text":"Not really."},{"who":"You","text":"Have you mentioned any of this to anyone at school?"},{"who":"Jack","text":"No."}],"cautious":[{"who":"You","text":"We don’t have to talk about anything you’re not ready for. What’s lunchtime usually like?"},{"who":"Jack","text":"It’s okay. I go to the library."},{"who":"You","text":"What do you like about it?"},{"who":"Jack","text":"It’s quiet. And I don’t really know many people here."},{"who":"You","text":"That sounds like quite a change from primary school."},{"who":"Jack","text":"Yeah. My friends went to other schools."},{"who":"You","text":"Have you wanted anyone at school to help with that?"},{"who":"Jack","text":"Not really."}],"misled":[{"who":"You","text":"What about lunchtime? What’s that been like?"},{"who":"Jack","text":"I mostly go to the library. I don’t really have friends here."},{"who":"You","text":"That sounds lonely sometimes."},{"who":"Jack","text":"Yeah. My old friends all go to different schools. The boys here already know each other."},{"who":"You","text":"Have you talked with anyone at school about that?"},{"who":"Jack","text":"No."}]},"n3":{"title":"I don’t want them to make it a big thing.","tip":["Empowerment, Voice and Choice","Collaboration and Mutuality","Safety"],"scene":[{"who":"Jack","text":"I don’t want them to make it a big thing."},{"who":"You","text":"Yeah, I hear you. You don’t want lots of people getting involved."},{"who":"Jack","text":"Yeah. That’d be weird."}],"prompt":"What would you say next?","options":[{"id":"A","label":"Ask Jack what support would feel manageable","sam":"We don’t need to decide now. Would you rather talk again, or think about one small thing that might help? I’ll explain any steps I need to take.","reaction":[{"who":"Jack","text":"Maybe I could just come here again. I don’t want Miss involved yet."},{"who":"You","text":"Okay. We can start by talking again. We’ll discuss any next steps together."}],"note":"Jack helps define the next step; collaboration does not mean guaranteeing that nothing will ever need to be shared."},{"id":"B","label":"Arrange teacher involvement immediately","sam":"I think Ms Taylor should know. I’ll speak with her so we can get some support in place.","reaction":[{"who":"Jack","text":"No, please don’t! I said I don’t want that."},{"who":"Narrator","text":"Jack grips the strap of his school bag."}],"note":"A well-intended support plan is introduced without first exploring Jack’s preferences."},{"id":"C","label":"Accept that Jack is not ready to act","sam":"Okay. We don’t need to sort anything out today. You’re welcome to talk again another time.","reaction":[{"who":"Jack","text":"Okay. Maybe."},{"who":"Narrator","text":"Jack looks relieved that he is not being pushed to decide."}],"note":"A valid way to respect pace, provided Sam still attends to any safeguarding duties and leaves a route back to support."}],"display_order":["C","A","B"]},"repair3":{"title":"Jack looks at you","prompt":"What would you say next?","options":[{"id":"repair","label":"Acknowledge the push and restore choice","sam":"You’re right. I got ahead of myself. I’m sorry. I haven’t spoken to Ms Taylor about this conversation. Let’s talk about what you would and wouldn’t be comfortable with, and what I may need to do if there’s a safety concern.","reaction":[{"who":"Jack","text":"I just don’t want everyone asking me questions."},{"who":"You","text":"That makes sense. Would you rather leave it for today or talk again another time?"},{"who":"Jack","text":"Maybe another time."}],"destination":"cautious"},{"id":"insist","label":"Insist on the proposed plan","sam":"I know you’re worried, but adults need to deal with this. I’ll talk to her.","reaction":[{"who":"Jack","text":"Then I’m not saying anything else. Can I go?"},{"who":"Narrator","text":"Jack picks up his bag."}],"destination":"early3"}],"display_order":["insist","repair"]},"promise_reveal":{"title":"But you said...","scene":[{"who":"Jack","text":"But you said you wouldn’t tell anybody."},{"who":"Narrator","text":"Jack remembers your earlier promise of complete secrecy. Even discussing possible support now creates confusion."}],"prompt":"What would you say to Jack?","options":[{"id":"correct","label":"Acknowledge and correct the promise","sam":"You’re right, Jack. I did say that, and I was wrong to promise it. I’m sorry. I won’t repeat everything you’ve said, but there are safety situations where I may need to share information. Before we decide anything else, I want to make sure you understand that.","reaction":[{"who":"Jack","text":"Oh. Okay. I need to think about it."},{"who":"You","text":"Of course. You don’t have to decide about next steps right now."}],"destination":"cautious"},{"id":"deflect","label":"Deflect Jack’s concern","sam":"Don’t worry about that. I’m just trying to help.","reaction":[{"who":"Jack","text":"I want to go back to class."}],"destination":"earlyPromise"}],"display_order":["deflect","correct"]},"endings":{"collaborative":{"title":"You agree to talk again","script":[{"who":"You","text":"We’ve talked about English, lunchtime, and getting used to Year 7. We don’t need to cover everything today. Would another chat here be okay, or would you rather leave it for now?"},{"who":"Jack","text":"I could come back another time."},{"who":"You","text":"Okay. We can plan that together."}],"summary":"Jack has had a meaningful say in what happens next. This is a promising initial connection, not a solved school problem.","reflect":["Which explanations helped Jack make an informed choice?","How was Jack’s preference included in planning?"]},"cautious":{"title":"The conversation pauses","script":[{"who":"You","text":"We don’t have to decide anything more today. If you want to talk again, we can. I’ll explain any steps I need to take."},{"who":"Jack","text":"Okay. Maybe."}],"summary":"Jack is not ready to commit to support. Respecting his pace can still be appropriate trauma-informed practice.","reflect":["What might Jack need before feeling ready to re-engage?","What responsibilities remain for you after this session?"]},"early1":{"title":"Jack returns to class","script":[{"who":"You","text":"Okay. We don’t need to keep talking now. I’m sorry I made this feel like you were in trouble. You’re welcome to talk with me another time."},{"who":"Jack","text":"Alright."},{"who":"Narrator","text":"Jack takes his bag and returns to class."}],"summary":"The first conversation ends before Jack has discussed his school experiences. You should follow school safeguarding and follow-up procedures as appropriate.","reflect":["How did the opening frame Jack as a problem?","How could you approach a future invitation differently?"]},"early2":{"title":"Jack chooses to leave","script":[{"who":"You","text":"Okay. We can stop here. I’m sorry I wasn’t clear when you asked about telling Ms Taylor. Before you go, I can explain what I can keep private, if you’d like."},{"who":"Jack","text":"Not now."},{"who":"You","text":"That’s okay."}],"summary":"Jack leaves without further disclosure. An unanswered question about information sharing may have undermined his sense of safety.","reflect":["What did Jack need to know to make an informed decision?","How could you keep the door open without pressure?"]},"early3":{"title":"The conversation ends early","script":[{"who":"You","text":"Okay, we’ll stop talking for now. I can see this hasn’t felt okay to you."},{"who":"Jack","text":"Okay."},{"who":"Narrator","text":"Jack leaves. You must not treat his refusal as permission to ignore any actual safety concerns."}],"summary":"The proposed help was not negotiated with Jack. The relationship may need repair before future engagement.","reflect":["How did the suggestion change the power dynamic?","Which smaller steps might have maintained Jack’s agency?"]},"earlyPromise":{"title":"Jack asks to leave","script":[{"who":"You","text":"Okay. I won’t keep you here. I’m sorry I wasn’t clear about what can be kept private."},{"who":"Jack","text":"Yeah."},{"who":"Narrator","text":"Jack leaves the session. You must clarify the misinformation appropriately and follow relevant practice procedures."}],"summary":"The earlier inaccurate promise has had a delayed consequence. Initial reassurance is not equivalent to informed trust.","reflect":["Why did the inaccurate promise initially appear effective?","What would accountable repair require now?"]}},"notes":{"no_labels":"Do not describe choices to learners as “correct/incorrect” during play. Pathway titles are for authoring only.","no_scoring":"Do not represent trust as a numeric score. Record choices and branch flags for story continuity.","no_diagnosis":"Do not imply Jack has a trauma diagnosis, ADHD, disability, abuse history, or mental-health condition.","policy":"Information-sharing scripts are examples, not a substitute for WA school child-protection/recordkeeping policy or site-specific supervision. Do not make unconditional secrecy promises.","endings":"Early endings are valid learner outcomes; student autonomy does not remove safety and statutory duties.","educational":"Jack’s reactions are one plausible narrative outcome, not certain psychological predictions.","presentation":"Show Context on its own screen. The opening conversation follows Start Conversation. Hide pedagogical option labels, TIP principle pills, decision counts, grading, pathway tracking and repair categories. Display the chosen dialogue and Jack’s reaction without explanatory feedback until the learner chooses to generate the complete conversation script at an ending.","display_order":"Option IDs are internal stable keys for branching (A/B/C semantics from v1). display_order lists those keys in visual sequence; visible A/B/C letters are assigned by position, not by semantic ID.","offline":"The HTML embeds a byte-for-byte copy of this JSON to run offline under file://. After editing this JSON, regenerate the HTML embedded scenario-data block.","navigation":"Back returns to the preceding page. Reopening a chosen decision offers Change response; changing the choice clears the forward history and recalculates all downstream branches. Going forward unchanged restores the earlier path.","theme":"Cream and forest-green palette coordinated with Submodule 1 example; Jack labels deep green, You labels warm taupe. Existing body and heading font sizes are retained.","generated_script":"At any ending, Generate conversation script reconstructs only the actually experienced dialogue. Every selected response (including repair and early-ending choices) is highlighted with its unique, prose-style reflection immediately underneath, in chronological order. No separate reflection cards or strength/limitation/impact template.","ending_disclaimer":"This is one possible way the conversation could unfold.","reflection_coverage":"19/19 possible selected responses have dedicated reflections: n1 3, repair1 2, n2 3, repair2_B 2, repair2_C 2, n3 3, repair3 2, promise_reveal 2."},"reflection_by_choice":{"n1":{"A":"By explaining why the meeting is happening and inviting Jack to share his perspective, you help make the interaction more predictable and less threatening. However, Jack was sent here by his teacher rather than choosing to seek support himself. Consider how much choice he feels he actually has, and how you might make that choice more meaningful.","B":"A relaxed, friendly response may make this first meeting feel less formal. Yet Jack has asked a direct question about why he is here, and reassurance alone leaves that uncertainty unanswered. Trauma-informed engagement involves more than helping someone feel comfortable in the moment; it also means giving them clear information about what is happening.","C":"You name a specific classroom concern, but you start with the teacher’s interpretation before hearing Jack’s perspective. His defensive response might be an attempt to protect himself from feeling blamed, rather than evidence that he does not want help. A more curious opening could make space for both the teacher’s concern and Jack’s own experience."},"repair1":{"repair":"You recognise that your earlier words may have sounded accusatory, acknowledge this and invite Jack to explain school from his point of view. Taking responsibility for a misstep can make a difficult interaction more workable. His hesitant agreement does not mean trust is fully restored, so the pace of the conversation still matters.","press":"Asking about unfinished work could eventually help you understand the classroom difficulty. Here, though, Jack has already become guarded, and pressing for an explanation may feel more like an investigation than a conversation. His request to return to class is important feedback. Respecting that boundary can preserve the possibility of another meeting."},"n2":{"A":"Jack’s question suggests that he is concerned about what might happen to the information he shares. Being transparent about notes, information-sharing and safety limits allows him to make a more informed decision about what to disclose. Trust does not depend on promising that nothing will be shared; it depends on giving accurate information and following through consistently. It may help to check what Jack has understood.","B":"You try to reassure Jack quickly, but his follow-up question shows that he still needs a concrete answer. When a young person is worried about who will hear what they say, moving past the question can create further uncertainty. A clearer explanation of confidentiality and its limits would help Jack decide what he feels comfortable sharing.","C":"The promise may immediately reassure Jack, which can make this response feel successful. But an absolute guarantee of secrecy is not something a school social worker can safely make when professional and safeguarding responsibilities apply. Jack needs accurate information to decide what to share. Correcting the promise may be uncomfortable, but leaving it uncorrected risks a later breach of trust."},"repair2_B":{"clarify":"You notice that your first answer did not address Jack’s concern and offer a clearer explanation. This is a form of repair: responding to what he is actually asking rather than relying on your original reassurance. He may still feel uncertain, so leaving space for questions is as important as providing the information.","dismiss":"Moving to an everyday topic such as lunchtime could ordinarily help with rapport. At this point, however, Jack is waiting for an answer about privacy. Changing the subject may suggest that his concern is not being taken seriously. His decision to stop the conversation reminds us that an apparently small moment of avoidance can affect willingness to engage."},"repair2_C":{"correct":"Correcting an inaccurate promise before Jack shares more is an important act of professional accountability. The correction may make him less relaxed for a while, but it gives him a more reliable basis for deciding what to say next. An apology creates an opportunity to rebuild trust; it does not entitle you to his immediate reassurance or further disclosure.","leave":"Jack appears comfortable enough to move on, but he is doing so without an accurate understanding of confidentiality. He may later share something he would have withheld if the limits had been clear. This is a reminder that a smooth conversation is not necessarily an ethically sound one: meaningful choice depends on truthful information."},"n3":{"A":"Rather than deciding what support Jack needs, you invite him to participate in planning the next step. This supports his sense of agency in a setting where adults hold considerable authority. Jack may not be ready to address every difficulty today, but having a meaningful say in what happens next can itself be part of initial engagement. Clear explanations of any steps you are required to take keep that choice genuine.","B":"Speaking with Ms Taylor might eventually help Jack with his classroom difficulties, but you announce that plan before exploring what worries him about adult involvement. His objection suggests he may experience the proposed support as a loss of control. A collaborative approach would make space for his concerns while still explaining any responsibilities you cannot set aside.","C":"You allow Jack to pause rather than pushing for a plan he has not chosen. Respecting his pace can be especially valuable in an initial meeting, when trust is still developing. This need not mean withdrawing support: you can leave a clear invitation to return and attend to any appropriate school follow-up or safeguarding responsibilities."},"repair3":{"repair":"You acknowledge moving too quickly and return to a discussion of Jack’s preferences and the limits of what can be promised. This models accountability and shared decision-making rather than insisting on your original plan. Jack still wants time, which is a legitimate outcome. Repair may protect the possibility of future engagement without producing immediate agreement.","insist":"You want to arrange adult support, but saying that adults need to deal with the situation gives Jack little room to influence what happens. His wish to leave may reflect a growing sense that he is not being heard. Where no immediate safety issue has been identified, explaining your responsibilities and seeking his input would provide a more collaborative path."},"promise_reveal":{"correct":"Jack has noticed the difference between the promise you made and what you can actually guarantee. Acknowledging the error directly, rather than defending it, shows accountability and restores an opportunity for informed choice. Jack now needs time to think. Respecting that pause is part of the repair, even if the conversation ends without a clear plan.","deflect":"Your intention to help may be genuine, but it does not answer Jack’s concern about a promise you made. Dismissing the contradiction may reinforce the very uncertainty that transparency is meant to reduce. Jack’s decision to leave shows why relational repair requires acknowledging the impact of your words, not simply repeating your good intentions."}}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('scenario-data').textContent);
const screenEl=document.getElementById('screen');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=obj=>JSON.parse(JSON.stringify(obj));
let S,backStack=[],forwardStack=[];
let reviewVisible=false;
function reset(){
 backStack=[];forwardStack=[];reviewVisible=false;
 S={screen:'intro',selected:null,node1Choice:null,repair1Choice:null,node2Choice:null,repair2Choice:null,unresolvedPromise:false,node3Choice:null,repair3Choice:null,promiseChoice:null,ending:null,history:[],bridge1:'A',bridge2:'clear'};
 render();jumpTop();
}
function jumpTop(){window.scrollTo({top:0,behavior:'instant'});}
function log(k,v){S.history.push({step:k,choice:v});} // Recorded internally, not displayed as a score.
function setScreen(next){
 reviewVisible=false;
 const previous=clone(S);
 if(forwardStack.length && forwardStack[forwardStack.length-1].screen===next){
   backStack.push(previous);S=forwardStack.pop();
 }else{
   backStack.push(previous);forwardStack=[];S.screen=next;S.selected=null;
 }
 render();jumpTop();
}
function goBack(){
 reviewVisible=false;
 if(!backStack.length)return;
 forwardStack.push(clone(S));S=backStack.pop();render();jumpTop();
}
function choose(id){if(S.selected!==id)forwardStack=[];S.selected=id;render();}
function changeResponse(){reviewVisible=false;S.selected=null;forwardStack=[];render();}
function finish(key){S.ending=key;setScreen('ending');}
function next(){
 const sel=S.selected,d=S.screen;
 if(d==='intro')return setScreen('opening');
 if(d==='opening')return setScreen('node1');
 if(d==='bridge1')return setScreen('node2');
 if(d==='bridge2')return setScreen('node3');
 if(d==='node1'){
   if(!sel)return;S.node1Choice=sel;log('n1',sel);
   if(sel==='C')return setScreen('repair1');
   S.bridge1=sel;return setScreen('bridge1');
 }
 if(d==='repair1'){
   if(!sel)return;S.repair1Choice=sel;log('repair1',sel);
   if(sel==='press')return finish('early1');
   S.bridge1='C_repaired';return setScreen('bridge1');
 }
 if(d==='node2'){
   if(!sel)return;S.node2Choice=sel;log('n2',sel);
   if(sel==='A'){S.unresolvedPromise=false;S.bridge2='clear';return setScreen('bridge2');}
   return setScreen('repair2');
 }
 if(d==='repair2'){
   if(!sel)return;S.repair2Choice=sel;log('repair2',sel);
   if(S.node2Choice==='B'){
     if(sel==='dismiss')return finish('early2');
     S.unresolvedPromise=false;S.bridge2='cautious';return setScreen('bridge2');
   }
   if(sel==='leave'){S.unresolvedPromise=true;S.bridge2='misled';}
   else{S.unresolvedPromise=false;S.bridge2='cautious';}
   return setScreen('bridge2');
 }
 if(d==='node3'){
   if(!sel)return;S.node3Choice=sel;log('n3',sel);
   if(sel==='A')return S.unresolvedPromise?setScreen('promiseReveal'):finish('collaborative');
   if(sel==='B')return setScreen('repair3');
   return finish('cautious');
 }
 if(d==='repair3'){
   if(!sel)return;S.repair3Choice=sel;log('repair3',sel);
   return finish(sel==='repair'?'cautious':'early3');
 }
 if(d==='promiseReveal'){
   if(!sel)return;S.promiseChoice=sel;log('promise',sel);
   if(sel==='correct'){S.unresolvedPromise=false;return finish('cautious');}
   return finish('earlyPromise');
 }
}
const dialog=lines=>`<div class="dialogue">${(lines||[]).map(x=>`<div class="line ${x.who==='Narrator'?'narrator':x.who==='You'?'speaker-you':'speaker-jack'}"><div class="who">${esc(x.who==='Sam'?'You':x.who)}</div><div>${esc(x.text)}</div></div>`).join('')}</div>`;
const backButton=()=>backStack.length?'<button type="button" class="back" data-action="back"><span aria-hidden="true">←</span> Back</button>':'';
const nav=(label='Continue',action='next',trailing='→')=>`<div class="nav-actions">${backButton()}<button type="button" class="cta" data-action="${action}">${esc(label)} <span aria-hidden="true">${trailing}</span></button></div>`;
const backOnly=()=>backStack.length?`<div class="nav-actions">${backButton()}</div>`:'';
function optionsInOrder(item){
 const index=Object.fromEntries(item.options.map(o=>[o.id,o]));
 return(item.display_order||item.options.map(o=>o.id)).map(id=>index[id]);
}
function decision(title,scene,prompt,item){
 const chosen=item.options.find(x=>x.id===S.selected);
 let t=`<h1>${esc(title)}</h1>${scene?dialog(scene):''}`;
 if(!chosen){
  t+=`<div class="prompt">${esc(prompt)}</div><div class="choice-list">`;
  t+=optionsInOrder(item).map((o,i)=>`<button type="button" class="choice" data-choose="${esc(o.id)}"><strong>${String.fromCharCode(65+i)}.</strong><span class="quote">“${esc(o.sam)}”</span></button>`).join('')+'</div>';
  t+=backOnly();
 }else{
  t+=`<div class="consequence">${dialog([{who:'You',text:chosen.sam},...chosen.reaction])}</div>`;
  // Available only when revisiting an earlier decision, to preserve the immersive first run.
  if(forwardStack.length)t+='<button type="button" class="change" data-action="change">Choose a different response</button>';
  t+=nav('Continue');
 }
 return t;
}

// Build a complete, chronological transcript of the ACTUAL route, including early endings.
// This reads committed choices, not prior button labels or the general history log.
function sessionTranscript(){
 const lines=[], selected=[];
 const add=arr=>{for(const x of (arr||[]))lines.push({...x});};
 const addDecision=(section,key,reflectKey)=>{
   const option=section.options.find(o=>o.id===key);
   if(!option)return;
   const index=selected.length+1;
   lines.push({who:'You',text:option.sam,chosen:index});
   selected.push({index,refKey:reflectKey,optionId:key,quote:option.sam});
   add(option.reaction);
 };
 add(DATA.opening);
 add(DATA.n1.scene);
 addDecision(DATA.n1,S.node1Choice,'n1');
 if(S.node1Choice==='C'){
   addDecision(DATA.repair1,S.repair1Choice,'repair1');
   if(S.repair1Choice==='press'){add(DATA.endings[S.ending].script);return {lines,selected};}
 }
 add(DATA.bridge1[S.bridge1]);
 add(DATA.n2.scene);
 addDecision(DATA.n2,S.node2Choice,'n2');
 if(S.node2Choice==='B'||S.node2Choice==='C'){
   const repairBlock=DATA.repair2[S.node2Choice];
   addDecision(repairBlock,S.repair2Choice,'repair2_'+S.node2Choice);
   if(S.node2Choice==='B'&&S.repair2Choice==='dismiss'){
     add(DATA.endings[S.ending].script);return {lines,selected};
   }
 }
 add(DATA.bridge2[S.bridge2]);
 add(DATA.n3.scene);
 addDecision(DATA.n3,S.node3Choice,'n3');
 if(S.node3Choice==='B')addDecision(DATA.repair3,S.repair3Choice,'repair3');
 if(S.node3Choice==='A'&&S.node2Choice==='C'&&S.repair2Choice==='leave'){
   add(DATA.promise_reveal.scene);
   addDecision(DATA.promise_reveal,S.promiseChoice,'promise_reveal');
 }
 add(DATA.endings[S.ending].script);
 return {lines,selected};
}
function reflectionFor(refKey,optionId){
 const value=DATA.reflection_by_choice?.[refKey]?.[optionId];
 if(typeof value!=='string'||!value.trim())throw new Error('Missing reflection for '+refKey+'/'+optionId);
 return value;
}
function reviewHtml(){
 const {lines,selected}=sessionTranscript();
 // Every user-selected response must have a reflection immediately beneath it.
 if(selected.length!==lines.filter(l=>l.chosen).length)throw new Error('Selected response coverage mismatch');
 let html=`<section class="script-review" id="scriptReview"><h2>Your conversation script</h2><p class="script-intro">Your chosen responses are highlighted, with a reflection underneath each one.</p><div class="transcript" aria-label="Your complete conversation script">`;
 html+=lines.map(l=>{
   const speaker=l.who==='Sam'?'You':l.who;
   const type=speaker==='Narrator'?'narrator':speaker==='You'?'speaker-you':'speaker-jack';
   let reflection='';
   if(l.chosen){
     const chosen=selected[l.chosen-1];
     const paragraph=reflectionFor(chosen.refKey,chosen.optionId);
     reflection=`<div class="inline-reflection"><div class="reflection-label">Reflection</div><p>${esc(paragraph)}</p></div>`;
   }
   return `<div class="line ${type}${l.chosen?' chosen-response':''}">${l.chosen?`<div class="chosen-marker">Your selected response ${l.chosen}</div>`:''}<div class="who">${esc(speaker)}</div><div>${esc(l.text)}</div>${reflection}</div>`;
 }).join('')+'</div></section>';
 return html;
}
function render(){
 let t='';const page=S.screen;
 if(page==='intro'){
   const c=DATA.context;
   t=`<h1>The First Meeting with Jack</h1><section class="context" aria-label="Scenario context"><dl><dt>Setting</dt><dd>${esc(c.setting)}</dd><dt>Your role</dt><dd>${esc(c.role)}</dd><dt>About Jack</dt><dd>${esc(c.student)}</dd></dl></section>${nav('Start Conversation')}`;
 }else if(page==='opening'){
   t=`<h1>First meeting</h1>${dialog(DATA.opening)}${nav('Continue')}`;
 }else if(['node1','node2','node3'].includes(page)){
   const item=DATA['n'+page.slice(-1)];t=decision(item.title,item.scene,item.prompt,item);
 }else if(['repair1','repair2','repair3','promiseReveal'].includes(page)){
   const item=page==='repair2'?DATA.repair2[S.node2Choice]:(page==='promiseReveal'?DATA.promise_reveal:DATA[page]);
   t=decision(item.title,item.scene,item.prompt,item);
 }else if(['bridge1','bridge2'].includes(page)){
   const b=page==='bridge1'?DATA.bridge1[S.bridge1]:DATA.bridge2[S.bridge2];
   t=`<h1>${page==='bridge1'?'Getting to know Year 7':'Lunchtime and friendships'}</h1>${dialog(b)}${nav('Continue')}`;
 }else if(page==='ending'){
   const e=DATA.endings[S.ending];
   t=`<h1>${esc(e.title)}</h1>${dialog(e.script)}<p class="next-copy">${esc(DATA.notes.ending_disclaimer)}</p><div class="nav-actions"><button type="button" class="cta" data-action="generateScript">Generate conversation script <span aria-hidden="true">↓</span></button></div>${reviewVisible?reviewHtml():''}${nav('Try another conversation','reset','↻')}`;
 }
 screenEl.innerHTML=t;
 screenEl.querySelectorAll('[data-choose]').forEach(el=>el.addEventListener('click',()=>choose(el.dataset.choose)));
 screenEl.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
   const a=el.dataset.action;
   if(a==='reset')reset();else if(a==='back')goBack();else if(a==='change')changeResponse();else if(a==='generateScript'){reviewVisible=true;render();document.getElementById('scriptReview')?.scrollIntoView({behavior:'smooth',block:'start'});}else next();
 }));
}
document.getElementById('resetTop').addEventListener('click',reset);
reset();
</script>
</body>
</html>
